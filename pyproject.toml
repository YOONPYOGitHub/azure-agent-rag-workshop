[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hanbit-travel-assistant"
version = "0.1.0"
description = "한빛(가상 회사) 출장 도우미: Microsoft Agent Framework + Azure AI Search"
requires-python = ">=3.11"
dependencies = [
  "agent-framework-core>=1.19.0,<2",
  "agent-framework-openai>=1.14.4,<2",
  "azure-search-documents>=11.6,<12",
  "openai>=2,<3",
  "httpx>=0.28,<1",
  "aiohttp>=3.12,<4",
  "python-dotenv>=1,<2",
  "streamlit>=1.50,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12", "ipykernel>=6,<8", "nbformat>=5.10,<6", "nbclient>=0.10,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/hanbit_assistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
